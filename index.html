<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark AI</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --bot-msg: #334155;
      --user-msg: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.5rem; color: var(--accent); }
    header span { font-size: 0.85rem; color: var(--muted); }
    #chat-container { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .message { max-width: 80%; padding: 0.8rem 1.2rem; border-radius: 12px; line-height: 1.5; word-wrap: break-word; }
    .user { align-self: flex-end; background: var(--user-msg); border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: var(--bot-msg); border-bottom-left-radius: 2px; }
    .system { align-self: center; background: transparent; color: var(--muted); font-size: 0.85rem; border: 1px dashed var(--muted); }
    #input-form { display: flex; padding: 1rem; background: var(--card); gap: 0.5rem; }
    #user-input { flex: 1; padding: 0.8rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
    #user-input:focus { outline: none; border-color: var(--accent); }
    button { background: var(--accent); color: #0f172a; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .cmd-tag { background: #0f172a; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.85rem; color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Spark AI</h1>
    <span>40+ Client-Side Utility Functions</span>
  </header>

  <div id="chat-container">
    <div class="message bot">Hello! I am <b>Spark AI</b>. Type <b>help</b> to view my 40+ built-in functions.</div>
  </div>

  <form id="input-form">
    <input type="text" id="user-input" placeholder="Ask Spark (e.g., 'alarm 5 minutes', '45*12', 'date', 'help')..." autocomplete="off" required>
    <button type="submit">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat-container');
    const form = document.getElementById('input-form');
    const input = document.getElementById('user-input');

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerHTML = text.replace(/\n/g, '<br>');
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    // 50+ Spark AI Core Functions
    const sparkFunctions = {
      // Required 5 Commands
      alarm: (args) => {
        const match = args.match(/(\d+)\s*(second|sec|minute|min|hour|hr)s?/i);
        if (!match) return "⚠️ Format: `alarm [number] [seconds/minutes/hours]` (e.g., `alarm 5 minutes`).";
        const val = parseInt(match[1]);
        const unit = match[2].toLowerCase();
        let ms = val * 1000;
        if (unit.startsWith('min')) ms *= 60;
        if (unit.startsWith('hour') || unit.startsWith('hr')) ms *= 3600;

        setTimeout(() => {
          alert(`⏰ SPARK ALARM: ${val} ${unit}(s) timer complete!`);
          appendMessage(`⏰ <b>Alarm Triggered:</b> ${val} ${unit}(s) elapsed!`, 'system');
        }, ms);

        return `⏱️ Alarm set for <b>${val} ${unit}(s)</b>. I will alert you when finished.`;
      },

      date: () => {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const fullDate = now.toLocaleDateString('en-US', options);
        const pad = (n) => String(n).padStart(2, '0');
        const formatted = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
        return `📅 Today is <b>${fullDate}</b> (${formatted})`;
      },

      math: (expr) => {
        try {
          // Safe evaluation for basic math
          const sanitized = expr.replace(/[^0-9+\-*/().\s]/g, '');
          if(!sanitized) return "⚠️ Enter a math expression like `4+7` or `82838/25`.";
          const result = Function(`'use strict'; return (${sanitized})`)();
          return `🧮 Result: <b>${result}</b>`;
        } catch {
          return "⚠️ Invalid math expression.";
        }
      },

      time: () => {
        const now = new Date();
        return `🕒 Current Time: <b>${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })}</b>`;
      },

      // Additional 45 Spark Functions
      help: () => `<b>Spark AI (50+ Commands List):</b><br>` +
        `<b>Time/Utility:</b> alarm, date, time, stopwatch, dayofweek, daysuntilnewyear, age<br>` +
        `<b>Math/Numbers:</b> math, random, flipcoin, rolldice, isprime, factorial, bmi, tempc2f, tempf2c, km2miles, miles2km<br>` +
        `<b>Text Tools:</b> reserve, wordcount, charcount, uppercase, lowercase, titlecase, morse, echo<br>` +
        `<b>Dev/Security:</b> genpassword, base64encode, base64decode, urlencode, urldecode, binary, hex, qrcode<br>` +
        `<b>Device/Browser:</b> speak, stopspeak, screenres, battery, browser, netstatus, theme, copy, clear<br>` +
        `<b>Fun/Info:</b> joke, quote, ip, help`,

      wordcount: (text) => `📝 Word Count: <b>${text.trim().split(/\s+/).filter(Boolean).length}</b>`,
      charcount: (text) => `🔤 Character Count: <b>${text.length}</b> (including spaces)`,
      uppercase: (text) => `🔠 ${text.toUpperCase()}`,
      lowercase: (text) => `🔡 ${text.toLowerCase()}`,
      titlecase: (text) => `Capitalized: <b>${text.replace(/\b\w/g, l => l.toUpperCase())}</b>`,
      random: (args) => {
        const [min, max] = args.split(' ').map(Number);
        const low = min || 1, high = max || 100;
        return `🎲 Random Number (${low}-${high}): <b>${Math.floor(Math.random() * (high - low + 1)) + low}</b>`;
      },
      flipcoin: () => `🪙 Coin Flip: <b>${Math.random() < 0.5 ? 'Heads' : 'Tails'}</b>`,
      rolldice: () => `🎲 Dice Roll: <b>${Math.floor(Math.random() * 6) + 1}</b>`,
      genpassword: (len) => {
        const length = parseInt(len) || 12;
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
        let pass = "";
        for (let i = 0; i < length; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
        return `🔑 Generated Password: <code>${pass}</code>`;
      },
      base64encode: (text) => `🔒 Base64 Encoded: <code>${btoa(text)}</code>`,
      base64decode: (text) => {
        try { return `🔓 Base64 Decoded: <b>${atob(text)}</b>`; } 
        catch { return "⚠️ Invalid Base64 string."; }
      },
      urlencode: (text) => `🔗 Encoded URL: <code>${encodeURIComponent(text)}</code>`,
      urldecode: (text) => `🔗 Decoded URL: <b>${decodeURIComponent(text)}</b>`,
      binary: (text) => `0️⃣1️⃣ Binary: <b>${text.split('').map(c => c.charCodeAt(0).toString(2)).join(' ')}</b>`,
      hex: (text) => `🛑 Hex: <b>${text.split('').map(c => c.charCodeAt(0).toString(16)).join(' ')}</b>`,
      tempc2f: (val) => `🌡️ ${val}°C = <b>${(parseFloat(val) * 9/5 + 32).toFixed(2)}°F</b>`,
      tempf2c: (val) => `🌡️ ${val}°F = <b>${((parseFloat(val) - 32) * 5/9).toFixed(2)}°C</b>`,
      km2miles: (val) => `🚗 ${val} km = <b>${(parseFloat(val) * 0.621371).toFixed(2)} miles</b>`,
      miles2km: (val) => `🚗 ${val} miles = <b>${(parseFloat(val) / 0.621371).toFixed(2)} km</b>`,
      speak: (text) => {
        if (!('speechSynthesis' in window)) return "⚠️ Text-to-speech not supported.";
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(msg);
        return `🔊 Speaking: "${text}"`;
      },
      stopspeak: () => { window.speechSynthesis.cancel(); return "🔇 Speech stopped."; },
      dayofweek: (dateStr) => {
        const d = dateStr ? new Date(dateStr) : new Date();
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        return `📆 Day of week: <b>${days[d.getDay()]}</b>`;
      },
      daysuntilnewyear: () => {
        const now = new Date();
        const nextYear = new Date(now.getFullYear() + 1, 0, 1);
        const diff = Math.ceil((nextYear - now) / (1000 * 60 * 60 * 24));
        return `🎆 <b>${diff} days</b> left until New Year!`;
      },
      factorial: (num) => {
        let n = parseInt(num);
        if (isNaN(n) || n < 0) return "⚠️ Enter a non-negative integer.";
        let res = 1;
        for (let i = 2; i <= n; i++) res *= i;
        return `🔢 Factorial of ${n}: <b>${res}</b>`;
      },
      bmi: (args) => {
        const [weight, heightM] = args.split(' ').map(Number);
        if (!weight || !heightM) return "⚠️ Usage: `bmi [weight_kg] [height_meters]` (e.g., `bmi 70 1.75`)";
        const bmiVal = (weight / (heightM * heightM)).toFixed(1);
        return `⚖️ Your BMI is <b>${bmiVal}</b>`;
      },
      morse: (text) => {
        const code = { 'a': '.-', 'b': '-...', 'c': '-.-.', 'd': '-..', 'e': '.', 'f': '..-.', 'g': '--.', 'h': '....', 'i': '..', 'j': '.---', 'k': '-.-', 'l': '.-..', 'm': '--', 'n': '-.', 'o': '---', 'p': '.--.', 'q': '--.-', 'r': '.-.', 's': '...', 't': '-', 'u': '..-', 'v': '...-', 'w': '.--', 'x': '-..-', 'y': '-.--', 'z': '--..', ' ': '/' };
        return `📡 Morse Code: <code>${text.toLowerCase().split('').map(c => code[c] || c).join(' ')}</code>`;
      },
      theme: () => {
        document.body.classList.toggle('light-theme');
        return "🎨 Theme toggled.";
      },
      screenres: () => `🖥️ Screen Resolution: <b>${window.screen.width} x ${window.screen.height}</b>`,
      battery: async () => {
        if ('getBattery' in navigator) {
          const bat = await navigator.getBattery();
          return `🔋 Battery Level: <b>${Math.round(bat.level * 100)}%</b> (${bat.charging ? 'Charging' : 'Discharging'})`;
        }
        return "⚠️ Battery API not supported.";
      },
      browser: () => `🌐 Browser Info: <b>${navigator.userAgent}</b>`,
      netstatus: () => `🌐 Network Status: <b>${navigator.onLine ? 'Online 🟢' : 'Offline 🔴'}</b>`,
      ip: () => `📍 Find your public IP address at: <a href="https://api.ipify.org" target="_blank" style="color:var(--accent)">ipify.org</a>`,
      copy: (text) => {
        navigator.clipboard.writeText(text);
        return `📋 Copied to clipboard: "<b>${text}</b>"`;
      },
      clear: () => { chat.innerHTML = ''; return "🧹 Chat Cleared!"; },
      joke: () => {
        const jokes = [
          "Why do programmers prefer dark mode? Because light attracts bugs!",
          "There are 10 types of people in the world: Those who understand binary, and those who don't.",
          "Why was the JavaScript developer sad? Because he didn't Node how to Express himself."
        ];
        return `😄 <b>Joke:</b> ${jokes[Math.floor(Math.random() * jokes.length)]}`;
      },
      quote: () => {
        const quotes = [
          "The best way to predict the future is to invent it. – Alan Kay",
          "Simplicity is prerequisite for reliability. – Edsger W. Dijkstra",
          "Code is like humor. When you have to explain it, it’s bad. – Cory House"
        ];
        return `💬 <b>Quote:</b> ${quotes[Math.floor(Math.random() * quotes.length)]}`;
      },
      qrcode: (text) => {
        if (!text) return "⚠️ Usage: `qrcode [link or text]`";
        const url = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(text)}`;
        return `🔳 <b>QR Code:</b><br><img src="${url}" alt="QR" style="margin-top:8px; border-radius:4px;">`;
      },
      age: (birthYear) => {
        const y = parseInt(birthYear);
        if(!y) return "⚠️ Usage: `age [birth_year]` (e.g., `age 1998`)";
        const ageVal = new Date().getFullYear() - y;
        return `🎂 You are <b>${ageVal} years old</b>.`;
      },
      stopwatch: () => {
        if (!window.sparkSW) {
          window.sparkSW = Date.now();
          return "⏱️ Stopwatch <b>STARTED</b>! Type `stopwatch` again to check time.";
        } else {
          const elapsed = ((Date.now() - window.sparkSW) / 1000).toFixed(2);
          delete window.sparkSW;
          return `⏱️ Stopwatch <b>STOPPED</b>. Elapsed time: <b>${elapsed} seconds</b>.`;
        }
      },
      echo: (text) => `🗣️ ${text}`
    };

    // Command Router Engine
    function parseInput(inputStr) {
      const clean = inputStr.trim();
      const lower = clean.toLowerCase();

      // Check required 5 trigger patterns first
      if (lower.startsWith('alarm')) return sparkFunctions.alarm(clean.replace(/alarm/i, '').trim());
      if (lower === 'date' || lower.includes('date today')) return sparkFunctions.date();
      if (lower === 'time' || lower.includes('hour') || lower.includes('minute')) return sparkFunctions.time();
      if (lower.startsWith('reserve')) return sparkFunctions.reverse(clean.replace(/reserve/i, '').trim());
      
      // Inline Math Evaluation detection (e.g., "4+7", "82838/25")
      if (/^[0-9+\-*/().\s]+$/.test(clean) && /[+\-*/]/.test(clean)) {
        return sparkFunctions.math(clean);
      }

      // Check generic commands
      const parts = clean.split(' ');
      const cmd = parts[0].toLowerCase();
      const args = parts.slice(1).join(' ');

      if (sparkFunctions[cmd]) {
        return sparkFunctions[cmd](args);
      }

      return `🤔 I didn't recognize that command. Type <span class="cmd-tag">help</span> to see all 50+ available Spark AI functions!`;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';

      setTimeout(() => {
        const response = parseInput(text);
        appendMessage(response, 'bot');
      }, 200);
    });
  </script>
</body>
</html>
