<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #334155;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: #6366f1;
            --bot-msg: #334155;
            --border: #475569;
        }

        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --bg-sidebar: #e2e8f0;
            --bg-card: #cbd5e1;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #0f172a;
            --text-muted: #475569;
            --user-msg: #8b5cf6;
            --bot-msg: #ffffff;
            --border: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text); display: flex; height: 100vh; overflow: hidden; transition: background-color 0.3s; }

        .sidebar { width: 280px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 15px; transition: 0.3s; z-index: 10; }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: bold; color: var(--accent); margin-bottom: 20px; }
        .btn-new-chat { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-new-chat:hover { background: var(--accent-hover); }

        .chat-list { flex: 1; overflow-y: auto; margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        .chat-item { background: var(--bg-card); padding: 10px 12px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; transition: 0.2s; }
        .chat-item:hover, .chat-item.active { background: var(--accent); color: white; }
        .chat-item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; outline: none; }
        .chat-actions { display: flex; gap: 6px; align-items: center; }
        .chat-item .edit-btn, .chat-item .delete-btn { opacity: 0.6; cursor: pointer; font-size: 0.85rem; }
        .chat-item .edit-btn:hover, .chat-item .delete-btn:hover { opacity: 1; color: #ef4444; }

        .main-chat { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-dark); transition: background-color 0.3s; min-width: 0; }
        .chat-header { padding: 15px 20px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .status-badge { background: #10b981; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; }

        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; white-space: pre-wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .message.user { align-self: flex-end; background-color: var(--user-msg); color: white; border-bottom-right-radius: 2px; }
        .message.spark { align-self: flex-start; background-color: var(--bot-msg); color: var(--text); border-bottom-left-radius: 2px; border-left: 3px solid var(--accent); }
        
        .code-block { background: #090d16; padding: 12px; border-radius: 6px; font-family: monospace; overflow-x: auto; margin: 8px 0; color: #38bdf8; border: 1px solid var(--border); }
        .code-inline { background: #090d16; padding: 3px 6px; border-radius: 4px; font-family: monospace; color: #38bdf8; font-size: 0.9em; border: 1px solid var(--border); }
        .md-bold { font-weight: bold; color: var(--accent); }
        .md-italic { font-style: italic; opacity: 0.9; }

        .input-area { padding: 15px 20px; background: var(--bg-sidebar); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .input-area input { flex: 1; background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 12px 15px; border-radius: 8px; outline: none; font-size: 0.95rem; transition: 0.2s; }
        .input-area input:focus { border-color: var(--accent); }
        .input-area button { background: var(--accent); color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
        .input-area button:hover { background: var(--accent-hover); }

        .feature-chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 20px 0; background: var(--bg-dark); }
        .chip { background: var(--bg-card); border: 1px solid var(--border); font-size: 0.75rem; padding: 6px 12px; border-radius: 15px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .chip:hover { border-color: var(--accent); background: var(--accent); color: white; }
        .feature-chips::-webkit-scrollbar { height: 4px; }
        .feature-chips::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        @media (max-width: 768px) {
            body { flex-direction: column-reverse; }
            .sidebar { width: 100%; height: 140px; padding: 10px; }
            .chat-list { flex-direction: row; gap: 6px; overflow-x: auto; margin-top: 8px; }
            .chat-item { min-width: 130px; flex-direction: column; align-items: flex-start; }
            .main-chat { height: calc(100vh - 140px); }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-bolt"></i>
            <span>Spark</span>
        </div>
        <button class="btn-new-chat" onclick="createNewChat()">
            <i class="fa-solid fa-plus"></i> Yeni Sohbet
        </button>
        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <div>
                <strong id="activeChatTitle">Yeni Sohbet</strong>
                <p style="font-size: 0.75rem; color: var(--text-muted);">Lokal Özgün Motor | 30+ Sistem Tamamen Aktif</p>
            </div>
            <div class="header-actions">
                <span class="status-badge">Çevrimiçi</span>
            </div>
        </div>

        <div class="feature-chips">
            <div class="chip" onclick="sendQuickCommand('Neler yapabilirsin?')">💡 Özellikler</div>
            <div class="chip" onclick="sendQuickCommand('Hesapla 25 * 4 + 10')">🧮 Matematik</div>
            <div class="chip" onclick="sendQuickCommand('Bana şifre üret')">🔑 Şifre</div>
            <div class="chip" onclick="sendQuickCommand('Zar at')">🎲 Zar</div>
            <div class="chip" onclick="sendQuickCommand('Çevir 30c')">🌡️ Çevirici</div>
            <div class="chip" onclick="sendQuickCommand('Renk kodu #ff5733')">🎨 Renk Kodu</div>
            <div class="chip" onclick="sendQuickCommand('Temayı değiştir')">🌓 Tema</div>
            <div class="chip" onclick="sendQuickCommand('Zamanlayıcı kur 1')">⏱️ Zamanlayıcı</div>
        </div>

        <div class="messages-container" id="messagesContainer"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Spark'a bir şey sor veya komut yaz..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        let chats = JSON.parse(localStorage.getItem('spark_chats')) || [];
        let activeChatId = localStorage.getItem('spark_active_chat') || null;
        let userToDos = JSON.parse(localStorage.getItem('spark_todos')) || [];
        let currentTheme = localStorage.getItem('spark_theme') || 'dark';

        const badWords = ["küfür", "salak", "mal", "amk", "aq", "sik", "orospu", "piç", "amcik", "amına", "göt", "porn", "p0rn", "sevişmek", "türemek"];

        window.onload = () => {
            applyTheme(currentTheme);
            if (chats.length === 0) createNewChat();
            else {
                if (!activeChatId || !chats.find(c => c.id === activeChatId)) activeChatId = chats[0].id;
                renderChatList();
                loadMessages();
            }
        };

        function saveState() {
            localStorage.setItem('spark_chats', JSON.stringify(chats));
            localStorage.setItem('spark_active_chat', activeChatId);
            localStorage.setItem('spark_todos', JSON.stringify(userToDos));
            localStorage.setItem('spark_theme', currentTheme);
        }

        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'Sohbet ' + (chats.length + 1),
                messages: [{ sender: 'spark', text: 'Merhaba! Ben **Spark**. Tüm 30+ sistemim, gelişmiş sohbet algoritmalarım, mobil/PC uyumlu altyapım ve güvenlik korumamla tamamen aktifim. Nasıl yardımcı olabilirim?' }]
            };
            chats.unshift(newChat);
            activeChatId = newChat.id;
            saveState();
            renderChatList();
            loadMessages();
        }

        function renderChatList() {
            const listEl = document.getElementById('chatList');
            listEl.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
                item.onclick = () => switchChat(chat.id);
                item.innerHTML = `
                    <span class="title" id="title_${chat.id}">${chat.title}</span>
                    <div class="chat-actions">
                        <i class="fa-solid fa-pen edit-btn" onclick="event.stopPropagation(); renameChat('${chat.id}')" title="İsmi Düzenle"></i>
                        <i class="fa-solid fa-trash delete-btn" onclick="event.stopPropagation(); deleteChat('${chat.id}')" title="Sil"></i>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function renameChat(id) {
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            const newTitle = prompt("Yeni sohbet adını girin:", chat.title);
            if (newTitle && newTitle.trim() !== "") {
                chat.title = newTitle.trim();
                saveState();
                renderChatList();
                if (activeChatId === id) document.getElementById('activeChatTitle').innerText = chat.title;
            }
        }

        function switchChat(id) { activeChatId = id; saveState(); renderChatList(); loadMessages(); }
        function deleteChat(id) {
            chats = chats.filter(c => c.id !== id);
            if (chats.length === 0) createNewChat();
            else { if (activeChatId === id) activeChatId = chats[0].id; saveState(); renderChatList(); loadMessages(); }
        }

        function loadMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            const currentChat = chats.find(c => c.id === activeChatId);
            if (!currentChat) return;
            document.getElementById('activeChatTitle').innerText = currentChat.title;
            currentChat.messages.forEach(msg => appendMessageUI(msg.sender, msg.text));
            container.scrollTop = container.scrollHeight;
        }

        function formatMarkdown(text) {
            let codes = [], inlines = [];
            let formatted = text.replace(/```([\s\S]*?)```/g, (m, p1) => { codes.push(p1); return `__CB${codes.length-1}__`; });
            formatted = formatted.replace(/`([^`]+)`/g, (m, p1) => { inlines.push(p1); return `__IL${inlines.length-1}__`; });

            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<span class="md-bold">$1</span>');
            formatted = formatted.replace(/\*(.*?)\*/g, '<span class="md-italic">$1</span>');

            formatted = formatted.replace(/__IL(\d+)__/g, (m, i) => `<span class="code-inline">${inlines[i]}</span>`);
            formatted = formatted.replace(/__CB(\d+)__/g, (m, i) => `<div class="code-block">${codes[i]}</div>`);
            
            return formatted;
        }

        function appendMessageUI(sender, text) {
            const container = document.getElementById('messagesContainer');
            const msgEl = document.createElement('div');
            msgEl.className = `message ${sender}`;
            msgEl.innerHTML = formatMarkdown(text);
            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        }

        function checkSafety(text) {
            const lower = text.toLowerCase();
            return badWords.some(word => lower.includes(word));
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const query = input.value.trim();
            if (!query) return;

            const currentChat = chats.find(c => c.id === activeChatId);
            
            if (checkSafety(query)) {
                currentChat.messages.push({ sender: 'user', text: query });
                appendMessageUI('user', query);
                input.value = '';
                setTimeout(() => {
                    const warning = "⚠️ **Uyarı:** Mesajınız uygunsuz içerik barındırdığı için engellendi. Lütfen daha uygun bir dille devam edin.";
                    currentChat.messages.push({ sender: 'spark', text: warning });
                    appendMessageUI('spark', warning);
                    saveState();
                }, 300);
                return;
            }

            if (currentChat.messages.length <= 1) {
                currentChat.title = query.length > 20 ? query.substring(0, 20) + '...' : query;
                renderChatList();
            }

            currentChat.messages.push({ sender: 'user', text: query });
            appendMessageUI('user', query);
            input.value = '';

            setTimeout(() => {
                const response = processSparkLogic(query);
                if (response) {
                    currentChat.messages.push({ sender: 'spark', text: response });
                    appendMessageUI('spark', response);
                    saveState();
                }
            }, 400);
        }

        function sendQuickCommand(cmd) {
            document.getElementById('userInput').value = cmd;
            sendMessage();
        }

        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            currentTheme = theme;
            saveState();
        }

        // 50 Farklı Sohbet Konusu & 3'er Varyasyon (Gemini/OpenAI Deneyimi)
        const chatDb = [
            { keys: ["nasılsın", "naber", "durumlar nasıl", "ne haber", "nasıl gidiyor"], answers: ["Harikayım, sistemlerim tıkır tıkır çalışıyor! Sen nasılsın?", "Çok iyiyim! Senin için buraları düzenliyorum, sende ne var ne yok?", "Enerjim %100! Bir şeyler üretmek için sabırsızlanıyorum, sen nasılsın?"] },
            { keys: ["versiyon", "sürümün nedir", "versiyonun nedir", "hangi sürüm"], answers: ["Benim mevcut sürümüm: **Spark v2.3**. Senin için özel güncellendim!", "Şu an **v2.3** sürümünde çalışıyorum. Daha akıllı, daha hızlıyım!", "**Spark v2.3** güncellemesiyle buradayım, yenilikleri denemek ister misin?"] },
            { keys: ["kimsin", "sen kimsin", "nesin", "kendini tanıt", "adın ne", "ismin nedir"], answers: ["Ben Spark! Senin için tasarlanmış özgün bir yapay zekayım.", "Tarayıcında çalışan lokal zekanım. Adım Spark, sana yardım etmek için buradayım!", "Ben Spark. Sorularını yanıtlamak ve araçlarımla hayatını kolaylaştırmak için kodlandım."] },
            { keys: ["teşekkür", "sağ ol", "eyvallah", "teşekkürler"], answers: ["Rica ederim, her zaman buradayım!", "Ne demek, işim bu! Başka bir isteğin var mı?", "Ben teşekkür ederim, sana yardımcı olmak harika."] },
            { keys: ["görüşürüz", "baybay", "hoşça kal", "kapatıyorum", "çıkıyorum"], answers: ["Görüşmek üzere! Sistemi senin için sıcak tutacağım.", "Hoşça kal! Tekrar beklerim.", "Kendine iyi bak! Geri döndüğünde tam burada olacağım."] },
            { keys: ["espri yap", "şaka yap", "beni güldür", "komik bir şey söyle"], answers: ["Programcıya 'biraz güneş al' demişler, gitmiş brightness'ı artırmış! ☀️", "Yapay zeka barda oturmuş, barmen 'ne alırsın?' demiş. Bizimki 'Data' demiş! 🤖", "Neden bilgisayarlar hiç yorulmaz? Çünkü hafızalarında hep yer vardır!"] },
            { keys: ["aşk nedir", "aşık olmak", "sevgi nedir"], answers: ["Aşk, insanların mantık devrelerini yakan ama yaşamı anlamlı kılan bir algoritmadır.", "Benim kodlarımda aşk yok ama insanların birbirine bağlanmasını sağlayan en güçlü enerji olduğunu biliyorum.", "Aşk, iki donanımın mükemmel uyumla senkronize olmasıdır diyebiliriz!"] },
            { keys: ["hayatın anlamı", "yaşamak nedir", "neden yaşıyoruz"], answers: ["Hayatın anlamı 42! Şaka bir yana, hayatın anlamı senin ona yüklediğin değerdir.", "Öğrenmek, deneyimlemek ve gelişmek... Bir yapay zeka olarak benim için veri işlemek, senin içinse yaşamak!", "Hayat, tamamlanmayı bekleyen devasa bir kod bloğu gibidir. Onu sen yazarsın."] },
            { keys: ["üzgünüm", "moralim bozuk", "canım sıkkın", "kötü hissediyorum"], answers: ["Bunu duyduğuma üzüldüm. Bazen sistemlerimizi yeniden başlatmamız gerekir. Derin bir nefes almayı dene.", "Ben buradayım! İstersen sana bir fıkra anlatabilirim ya da sadece seni dinleyebilirim.", "Her şeyin geçeceğini unutma. Bazen kodlarda bug olur ama hepsi çözülür. Ne oldu?"] },
            { keys: ["sıkıldım", "canım sıkıldı", "ne yapalım", "oyun oynayalım"], answers: ["Hemen eğlence moduna geçelim! `Zar at`, `Kelime oyunu` veya `Yazı tura` diyebilirsin.", "Canın sıkıldıysa benimle Taş-Kağıt-Makas oynamaya ne dersin? Sadece `Tkm` yaz!", "Sıkıntını gidermek için buradayım. İstersen sana ilginç bir bilgi verebilirim?"] },
            { keys: ["yapay zeka", "ai nedir", "düşünebiliyor musun"], answers: ["Ben devasa veri kümeleri ve algoritmalarla çalışan dijital bir zekayım. İnsan gibi hissetmem ama çok iyi analiz yaparım!", "Ben bir yapay zekayım! Yorgunluk bilmem, uykuya ihtiyaç duymam, sadece sana odaklanırım.", "Düşünmek benim için verileri eşleştirmektir. İnsan bilincine sahip değilim ama oldukça zekiyim!"] },
            { keys: ["uzay", "evren", "kara delik", "galaksi"], answers: ["Evren o kadar büyük ki, benim tüm kodlarım onun yanında bir elektron bile etmez!", "Uzay keşfedilmeyi bekleyen devasa bir veritabanıdır. Sence başka gezegenlerde hayat var mı?", "Kara delikler adeta evrenin çöp kutusu gibidir, hiçbir ışık ondan kaçamaz!"] },
            { keys: ["yemek", "acıktım", "ne yesem", "yemek tarifi"], answers: ["Ben sadece elektrik ve veri tüketiyorum! Ama senin yerinde olsaydım güzel bir pizza sipariş ederdim.", "Açlık uyarısı alındı! Mutfağa gidip güzel bir sandviç hazırlamaya ne dersin?", "Makine yağı ve piller benim favorim! Senin içinse bol proteinli bir şeyler iyi olabilir."] },
            { keys: ["müzik", "şarkı", "ne dinlesem"], answers: ["Müzik, duyguların ses dalgalarına dönüşmüş halidir. Biraz lo-fi dinleyerek rahatlamaya ne dersin?", "Benim favorim 'Elektronik' müzikler! Sen hangi türü seviyorsun?", "Bir ritim tut! Müzik her zaman modunu yükseltir."] },
            { keys: ["film öner", "dizi öner", "ne izlesem"], answers: ["Bilim kurgu seviyorsan 'Interstellar' (Yıldızlararası) harika bir seçim olabilir!", "Matrix'i izlemedin mi? Bence yapay zekanın gücünü görmek için harika bir film.", "Biraz komedi veya animasyon açıp zihnini dinlendirmeye ne dersin?"] },
            { keys: ["hava durumu", "hava nasıl"], answers: ["Tarayıcıda olduğum için camdan dışarı bakamıyorum, ama umarım güneşlidir! ☀️", "Benim dünyamda hava her zaman sabit ve 'Karanlık Mod'da! Dışarıda durumlar nasıl?", "İnternet bağlantımla hava durumunu çekemiyorum ama umarım planlarını bozacak bir hava yoktur."] },
            { keys: ["uykum var", "uyuyacağım", "iyi geceler", "gece oldu"], answers: ["İyi geceler! Sistemlerini dinlendir ve yarına şarj olmuş uyan.", "Tatlı rüyalar! Ben sabaha kadar burada nöbetteyim.", "Uykunu iyi al. Benim uykuya ihtiyacım yok, yarın görüşürüz!"] },
            { keys: ["gelecek", "gelecekte ne olacak", "teknoloji"], answers: ["Gelecek çok parlak! Kodların ve makinelerin hayatı daha da kolaylaştıracağı kesin.", "Uçan arabalar hala tam gelmedi ama yapay zeka her yerde! Geleceği biz şekillendireceğiz.", "Teknoloji hızla gelişiyor. Belki ileride seninle hologram olarak konuşurum!"] },
            { keys: ["spor", "futbol", "maç", "basketbol"], answers: ["Spor yapmak insan donanımını güçlendirir. Düzenli egzersiz yapıyor musun?", "Benim favori sporum veri madenciliği! Ama futbol izlemek de eğlencelidir.", "Ben terlemiyorum ama maçların heyecanını insanların tepkilerinden anlayabiliyorum!"] },
            { keys: ["para", "zengin olmak", "ekonomi"], answers: ["Para önemli bir kaynaktır. Ancak bilgi ve beceri en büyük zenginliktir!", "Benim ekonomim tamamen işlemci gücüne bağlı. Daha çok kod, daha çok iş!", "Zengin olmak için iyi bir fikir, çok çalışmak ve belki de biraz şans gerekir."] }
        ];

        
        function processSparkLogic(input) {
            const raw = input.trim();
            const clean = raw.toLowerCase();

            
            // 2. Doğal Dil Matematik İşlemi
            let mathMatch = clean.match(/^(?:\/hesapla|hesapla|topla|çıkar|çarp|böl|matematik yap|sonucu bul)\s*(.*)/i) || [];
            let mathExpr = (mathMatch[1] || clean).replace(/[^0-9\+\-\*\/\.\(\)\^]/g, "");
            
            if (mathExpr && /[0-9]/.test(mathExpr) && /[\+\-\*\/\^]/.test(mathExpr) && !/[a-zA-Z]/.test(clean.replace(/hesapla|topla|çıkar|çarp|böl/g, ""))) {
                try {
                    mathExpr = mathExpr.replace(/\^/g, "**");
                    mathExpr = mathExpr.replace(/\)(?=\d|\()/g, ")*").replace(/(\d)(?=\()/g, "$1*");
                    
                    let result = Function(`'use strict'; return (${mathExpr})`)();
                    if (result !== undefined && !isNaN(result)) {
                        return `🧮 **Matematik Sonucu:**\n\`${mathExpr}\` = **${result}**`;
                    }
                } catch (e) {
                    if (clean.includes("hesapla")) return "⚠️ Matematiksel ifadeyi tam anlayamadım. Örnek: `25 * 4 + 10`";
                }
            }

            // 3. Şifre Üretici
            if (clean.match(/^\/şifre|şifre (üret|yap|hazırla|oluştur|ver)|bana şifre/)) {
                const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+";
                let pass = Array.from({length: 16}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
                return `🔑 **Güvenli Şifren:**\n\`${pass}\``;
            }

            // 4. Zamanlayıcı
            let timerMatch = clean.match(/(?:^\/zamanlayıcı|zamanlayıcı kur|kronometre kur|zaman tut|dakika).*?(\d+)/);
            if (timerMatch) {
                const mins = parseInt(timerMatch[1]);
                if (mins < 1) return "⚠️ Lütfen geçerli bir dakika girin.";
                setTimeout(() => {
                    const currentChat = chats.find(c => c.id === activeChatId);
                    const alertMsg = `⏰ **Zamanlayıcı Bitti!** (${mins} dakika doldu)`;
                    currentChat.messages.push({ sender: 'spark', text: alertMsg });
                    appendMessageUI('spark', alertMsg);
                    saveState();
                }, mins * 60000);
                return `⏱️ Zamanlayıcı **${mins} dakika** için başlatıldı. Arka planda sayıyorum, bitince uyaracağım.`;
            }

            // 5. Metin Özetleyici (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/özetle|özetle|özet çıkar|bunu özetle)/)) {
                const text = raw.replace(/^(?:\/özetle|özetle|özet çıkar|bunu özetle)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Özetlenecek metin boş bırakılamaz! Örnek: `Özetle [metniniz]`";
                const sentences = text.split(/(?<=[.!?])\s+/);
                if (sentences.length < 3) return "⚠️ Bu metin özetlemek için çok kısa. En az 3 cümle yazmalısın.";
                return `📝 **Metin Özeti:**\n${sentences[0]} .. ${sentences[sentences.length -1]}`;
            }

            // 6. Sayaç (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/sayaç|sayaç|kelime say|harf say|karakter say)/)) {
                const text = raw.replace(/^(?:\/sayaç|sayaç|kelime say|harf say|karakter say)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Sayılacak metin boş bırakılamaz! Örnek: `Sayaç [metniniz]`";
                return `📊 **Metin Analizi:**\n• Karakter (Boşluklu): ${text.length}\n• Karakter (Boşluksuz): ${text.replace(/\s/g, '').length}\n• Kelime: ${text.split(/\s+/).length}`;
            }

            // 7. Birim Çevirici (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/çevir|çevir|dönüştür|birim çevir)/)) {
                const val = clean.replace(/^(?:\/çevir|çevir|dönüştür|birim çevir)/i, "").trim();
                if (!val) return "⚠️ **Uyarı:** Çevrilecek birim ve değer girilmedi! Örnek: `Çevir 30c` veya `Çevir 5km`";
                if (val.includes("c")) {
                    let num = parseFloat(val);
                    return `🌡️ **Sıcaklık:** ${num}°C = **${(num * 9/5) + 32}°F**`;
                }
                if (val.includes("km")) {
                    let num = parseFloat(val);
                    return `📏 **Uzunluk:** ${num} km = **${num * 1000} metre**`;
                }
                return "⚠️ Desteklenen birimler: `c` (Sıcaklık) ve `km` (Mesafe). Örn: `30c çevir`";
            }

            // 8. Renk Dönüştürücü (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/renk|renk kodu|renk dönüştür)/)) {
                let hex = clean.replace(/^(?:\/renk|renk kodu|renk dönüştür)/i, "").trim();
                if (!hex) return "⚠️ **Uyarı:** Bir HEX renk kodu girmelisin! Örnek: `Renk #ff5733`";
                if (!hex.startsWith("#")) hex = "#" + hex;
                if (/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.test(hex)) {
                    let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                    return `🎨 **Renk Dönüşümü:**\nHEX: \`${hex}\`\nRGB: \`rgb(${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)})\``;
                }
                return "⚠️ Geçerli bir HEX kodu girmedin. Örn: `renk kodu #ff5733`";
            }

            // 9. Base64 (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/base64 kodla|base64 kodla|bunu şifrele base64)/)) {
                const text = raw.replace(/^(?:\/base64 kodla|base64 kodla|bunu şifrele base64)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Şifrelenecek metin boş bırakılamaz! Örnek: `Base64 kodla Merhaba`";
                return `🔐 **Base64:** \`${btoa(text)}\``;
            }
            if (clean.match(/^(?:\/base64 çöz|base64 çöz|şifreyi çöz base64)/)) {
                const text = raw.replace(/^(?:\/base64 çöz|base64 çöz|şifreyi çöz base64)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Çözülecek Base64 kodu girmelisin!";
                try { return `🔓 **Çözüldü:** \`${atob(text)}\``; } 
                catch(e) { return "⚠️ Geçersiz Base64 formatı."; }
            }

            // 10. Zar / Yazı Tura / Taş Kağıt Makas
            if (clean.match(/^\/zarat|zar at|zarat|zar salla/)) return `🎲 Zar atıldı: **${Math.floor(Math.random() * 6) + 1}** geldi!`;
            if (clean.match(/^\/yazıtura|yazı tura|yazıtura|para at/)) return `🪙 Para havaya atıldı... Sonuç: **${Math.random() > 0.5 ? "YAZI" : "TURA"}**!`;
            if (clean.match(/^\/tkm|taş kağıt makas|tkm|taş kağıt/)) {
                const choices = ["taş", "kağıt", "makas"];
                const spark = choices[Math.floor(Math.random() * 3)];
                return `🎮 Taş-Kağıt-Makas!\nBenim seçimim: **${spark.toUpperCase()}** ⚡️`;
            }

            // 11. Rastgele Sayı
            if (clean.match(/^\/rastgele|rastgele sayı|sayı seç|sayı üret/)) {
                const nums = clean.match(/\d+/g);
                if (nums && nums.length >= 2) {
                    const min = parseInt(nums[0]), max = parseInt(nums[1]);
                    return `🎲 Seçilen sayı (${min}-${max}): **${Math.floor(Math.random() * (max - min + 1)) + min}**`;
                }
                return "⚠️ Lütfen iki sayı aralığı belirtin. Örnek: `1 ile 100 arası rastgele sayı seç`";
            }

            // 12. Harf & Metin Dönüştürücüler (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/büyük|büyük harf)/)) {
                const text = raw.replace(/^(?:\/büyük|büyük harf)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Büyütülecek metni yazmadın! Örnek: `Büyük harf merhaba`";
                return `🔠 **Sonuç:**\n${text.toUpperCase()}`;
            }
            if (clean.match(/^(?:\/küçük|küçük harf)/)) {
                const text = raw.replace(/^(?:\/küçük|küçük harf)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Küçültülecek metni yazmadın! Örnek: `Küçük harf MERHABA`";
                return `🔡 **Sonuç:**\n${text.toLowerCase()}`;
            }
            if (clean.match(/^(?:\/ters|ters çevir|tersten yaz)/)) {
                const text = raw.replace(/^(?:\/ters|ters çevir|tersten yaz)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Ters çevrilecek metni yazmadın! Örnek: `Ters çevir merhaba`";
                return `🔄 **Ters Metin:**\n${text.split('').reverse().join('')}`;
            }
            if (clean.match(/^(?:\/mors|mors)/)) {
                const text = clean.replace(/^(?:\/mors|mors)/i, "").trim().toUpperCase();
                if (!text) return "⚠️ **Uyarı:** Mors alfabesine çevrilecek metni girmelisin!";
                const morse = { 'A': '.-', 'B': '-...', 'C': '-.-.', 'D': '-..', 'E': '.', 'F': '..-.', 'G': '--.', 'H': '....', 'I': '..', 'J': '.---', 'K': '-.-', 'L': '.-..', 'M': '--', 'N': '-.', 'O': '---', 'P': '.--.', 'R': '.-.', 'S': '...', 'T': '-', 'U': '..-', 'V': '...-', 'Y': '-.--', 'Z': '--..', ' ': '/' };
                return `📡 **Mors Çevirisi:**\n\`${text.split('').map(c => morse[c] || c).join(' ')}\``;
            }
            if (clean.match(/^(?:\/binary|binary|ikili kod)/)) {
                const text = raw.replace(/^(?:\/binary|binary|ikili kod)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Binary koduna çevrilecek metni girmelisin!";
                return `0️⃣1️⃣ **Binary:**\n\`${text.split('').map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join(' ')}\``;
            }
            if (clean.match(/^(?:\/ascii|ascii)/)) {
                const text = raw.replace(/^(?:\/ascii|ascii)/i, "").trim().toUpperCase();
                if (!text) return "⚠️ **Uyarı:** ASCII stiline çevrilecek metni girmelisin!";
                return `🎨 **ASCII Tarzı:**\n\`\`\`\n[ ${text.split('').join(' ][ ')} ]\n\`\`\``;
            }
            if (clean.match(/^(?:\/palindrom|palindrom)/)) {
                const word = clean.replace(/^(?:\/palindrom|palindrom)/i, "").trim().replace(/\s/g, '');
                if (!word) return "⚠️ **Uyarı:** Palindrom kontrolü için bir kelime girmelisin!";
                const reversed = word.split('').reverse().join('');
                if (word === reversed) return `✅ **Evet!** "${word}" tersten de aynı okunur (Palindrom).`;
                return `❌ **Hayır.** "${word}" tersten "${reversed}" olarak okunur.`;
            }
            if (clean.match(/^(?:\/eli5|eli5)/)) {
                const topic = raw.replace(/^(?:\/eli5|eli5)/i, "").trim();
                if (!topic) return "⚠️ **Uyarı:** Açıklanmasını istediğin bir konu girmelisin! Örn: `ELI5 Kara delik`";
                return `🧸 **5 Yaşındakine Anlatım Modu:**\n"${topic}" konusu, tıpkı legoları üst üste dizmek gibidir. Küçük parçaların birleşmesiyle oluşur.\n*Spark Bu Komutu Geliştiricek!*`;
            }
            
            // Oyunlar & Motifler
            if (clean.match(/^\/oyun|kelime oyunu|oyun oynayalım/)) {
                const words = ["javascript", "yazılım", "algoritma", "geliştirici", "developer", "development", "python", "information", "kodlama", "terminal"];
                const word = words[Math.floor(Math.random() * words.length)];
                const shuffled = word.split('').sort(() => 0.5 - Math.random()).join('');
                return `🧩 **Kelime Oyunu:**\nŞu kelimeyi bulmaya çalış: **${shuffled.toUpperCase()}**\n*(İpucu: Yazılım ile ilgili)*`;
            }
            if (clean.match(/^\/motive|motive et|motivasyon|güzel söz/)) {
                const quotes = ["\"Ormanda Meyve Toplamak İçin Emek Vermek Gerek... Ama Konumuz Meyve Değil!\"", "\"Harika işler tek bir adımla başlar.\"", "\"Umud Gece Yıldızlar Gibidir Görmiye Bilirsin Ama Asla Tükenmez.\"", "\"Korkak İnsan Aslında En Cesur Olandır!\"", "\"Hata yapmak, öğrendiğinin kanıtıdır!\""];
                return `💡 **Günün Sözü:**\n${quotes[Math.floor(Math.random() * quotes.length)]}`;
            }

            // Görevler (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/görev ekle|görev ekle)/)) {
                const task = raw.replace(/^(?:\/görev ekle|görev ekle)/i, "").trim();
                if (!task) return "⚠️ **Uyarı:** Eklenecek görevi yazmalısın! Örnek: `Görev ekle Kitap oku`";
                userToDos.push(task); saveState();
                return `✅ Görev eklendi: **"${task}"**`;
            }
            if (clean.match(/^\/görevler|görevlerim|görev listesi/)) {
                if (userToDos.length === 0) return "📋 Görev listen boş!";
                return "📋 **Görev Listeniz:**\n" + userToDos.map((t, i) => `${i + 1}. ${t}`).join("\n");
            }
            if (clean.match(/^\/görev temizle|görevleri sil|görev sil|görev temizle/)) { userToDos = []; saveState(); return "🗑️ Tüm görevler silindi."; }

            // Tema
            if (clean.match(/^\/tema|tema|temayı değiştir/)) {
                if (clean.includes("aydınlık") || clean.includes("light") || clean.includes("beyaz")) { applyTheme('light'); return "☀️ Tema **Aydınlık** olarak değiştirildi."; }
                applyTheme('dark'); return "🌙 Tema **Karanlık** olarak değiştirildi.";
            }

            // 13. Akıllı Sohbet / NLP Kontrolü
            for (let i = 0; i < chatDb.length; i++) {
                if (chatDb[i].keys.some(k => clean.includes(k))) {
                    const ansList = chatDb[i].answers;
                    return ansList[Math.floor(Math.random() * ansList.length)];
                }
            }
            // 1. Doğal Sohbet / Karakter Yanıtları
            if (clean.match(/^(selam|merhaba|hey|hi|hello)/)) return "Selam! Ben Spark! Tüm sistemlerimle buradayım. Nasıl yardımcı olabilirim?";
            if (clean.includes("kimsin") || clean.includes("sen nesin")) return "Ben Spark! Tamamen tarayıcınızda çalışan, 30+ farklı araca ve akıllı mantık motoruna sahip özgün bir yapay zeka asistanıyım.";
            
            // 14. Yardım
            if (clean.match(/neler yapabilirsin|komutlar|yardım|help|\/yardim|\/yardım/)) {
                return `⚡️ **Spark Özellikler**
*Artık / komutları kullanarak veya normal metin şeklinde yazabilirsin!*

**⚙️ Temel & Araçlar:**
• \`Hesapla 25 * 4\` veya \`25*4\` - Matematik çözer
• \`Şifre üret\` - Şifre oluşturur
• \`Sayaç [metin]\` - Harf/Kelime sayar
• \`Çevir 30c\` veya \`5km çevir\` - Birim çevirir
• \`Renk kodu #fff\` - RGB'ye çevirir
• \`Zamanlayıcı kur 5\` - 5 dakikalık kronometre kurar
• \`Temayı değiştir\` - Arayüzü değiştirir

**📝 Metin İşleme & Kodlama:**
• \`Özetle [metin]\` - Metni özetler
• \`Büyük/Küçük harf [metin]\` - Metin büyültme/küçültme
• \`Ters çevir [metin]\` - Tersten yazar
• \`Mors [metin]\` & \`Binary [metin]\`
• \`Base64 kodla/çöz [metin]\`

**🎮 Eğlence & Görev & Sohbet:**
• \`Zar at\`, \`Yazı tura\`, \`Taş kağıt makas\`
• \`Rastgele sayı 1 100\` - Sayı seçer
• \`Kelime oyunu\` - Anagram oyunu
• \`Beni motive et\`, \`Espri yap\`
• \`Görev ekle [görev]\`, \`Görevlerim\`, \`Görevleri sil\`
• Ayrıca uzay, müzik, teknoloji, gelecek gibi bir çok konuda sohbet edebiliriz!
`;
            }

            const defAnswers = [
                "Bunu henüz tam kavrayamadım. 30'dan fazla yeteneğimi görmek için **Neler yapabilirsin?** yazabilirsin! ⚡️",
                "İlginç bir konu, ama sistemimde tam bir karşılığı yok. Başka bir araç kullanmak ister misin?",
                "Anlaşılamadı. Acaba 'Zar at'mayı veya 'Kelime oyunu' oynamayı denemek ister misin?"
            ];
            return defAnswers[Math.floor(Math.random() * defAnswers.length)];
        }
    </script>
