<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spark AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #334155;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: #6366f1;
            --bot-msg: #334155;
            --border: #475569;
        }

        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --bg-sidebar: #e2e8f0;
            --bg-card: #cbd5e1;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #0f172a;
            --text-muted: #475569;
            --user-msg: #8b5cf6;
            --bot-msg: #ffffff;
            --border: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* 100dvh mobil cihazlarda tarayıcı çubuğu sorununu çözer */
        html, body { 
            background-color: var(--bg-dark); 
            color: var(--text); 
            display: flex; 
            height: 100dvh; 
            width: 100%;
            overflow: hidden; 
            transition: background-color 0.3s; 
        }

        /* YENİ: Mobil için Arka Plan Karartması (Overlay) */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 998;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active { display: block; }

        .sidebar { 
            width: 280px; 
            background-color: var(--bg-sidebar); 
            border-right: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            transition: 0.3s ease; 
            z-index: 999; 
            height: 100dvh;
        }
        
        .brand { display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: bold; color: var(--accent); margin-bottom: 20px; }
        .btn-new-chat { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-new-chat:hover { background: var(--accent-hover); }

        .chat-list { flex: 1; overflow-y: auto; margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        .chat-item { background: var(--bg-card); padding: 10px 12px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; transition: 0.2s; }
        .chat-item:hover, .chat-item.active { background: var(--accent); color: white; }
        .chat-item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; outline: none; }
        .chat-actions { display: flex; gap: 6px; align-items: center; }
        .chat-item .edit-btn, .chat-item .delete-btn { opacity: 0.6; cursor: pointer; font-size: 0.85rem; }
        .chat-item .edit-btn:hover, .chat-item .delete-btn:hover { opacity: 1; color: #ef4444; }

        .main-chat { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-dark); transition: background-color 0.3s; min-width: 0; height: 100dvh; }
        
        .chat-header { padding: 15px 20px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        
        /* YENİ: Hamburger Menü Butonu */
        .hamburger-btn { display: none; font-size: 1.4rem; cursor: pointer; color: var(--text); margin-right: 15px; }
        .header-left { display: flex; align-items: center; }
        
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .status-badge { background: #10b981; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; }

        /* DÜZELTME: flex: 1 1 0; ile taşmaları engelledik */
        .messages-container { flex: 1 1 0; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; white-space: pre-wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .message.user { align-self: flex-end; background-color: var(--user-msg); color: white; border-bottom-right-radius: 2px; }
        .message.spark { align-self: flex-start; background-color: var(--bot-msg); color: var(--text); border-bottom-left-radius: 2px; border-left: 3px solid var(--accent); }
        
        .code-block { background: #090d16; padding: 12px; border-radius: 6px; font-family: monospace; overflow-x: auto; margin: 8px 0; color: #38bdf8; border: 1px solid var(--border); }
        .code-inline { background: #090d16; padding: 3px 6px; border-radius: 4px; font-family: monospace; color: #38bdf8; font-size: 0.9em; border: 1px solid var(--border); }
        .md-bold { font-weight: bold; color: var(--accent); }
        .md-italic { font-style: italic; opacity: 0.9; }

        .input-area { padding: 15px 20px; background: var(--bg-sidebar); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .input-area input { flex: 1; background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 12px 15px; border-radius: 8px; outline: none; font-size: 0.95rem; transition: 0.2s; }
        .input-area input:focus { border-color: var(--accent); }
        .input-area button { background: var(--accent); color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 1.1rem; flex-shrink: 0; }
        .input-area button:hover { background: var(--accent-hover); }

        .feature-chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 20px 0; background: var(--bg-dark); flex-shrink: 0; }
        .chip { background: var(--bg-card); border: 1px solid var(--border); font-size: 0.75rem; padding: 6px 12px; border-radius: 15px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .chip:hover { border-color: var(--accent); background: var(--accent); color: white; }
        .feature-chips::-webkit-scrollbar { height: 4px; }
        .feature-chips::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* YENİ: Mobil ve Tablet Uyumluluğu */
        @media (max-width: 768px) {
            .hamburger-btn { display: block; }
            
            /* Sidebar'ı ekranın soluna gizle */
            .sidebar { 
                position: fixed; 
                left: -320px; 
                top: 0; 
                height: 100dvh; 
                width: 280px; 
                box-shadow: 4px 0 15px rgba(0,0,0,0.5);
            }
            
            /* Sidebar açıldığında çalışacak class */
            .sidebar.open { left: 0; }
            
            .input-area { padding: 12px 15px; }
            .chat-header { padding: 12px 15px; }
            .messages-container { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- YENİ: Arka Plan Karartması -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="brand">
            <i class="fa-solid fa-bolt"></i>
            <span>Spark</span>
        </div>
        <button class="btn-new-chat" onclick="createNewChat()">
            <i class="fa-solid fa-plus"></i> Yeni Sohbet
        </button>
        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <div class="header-left">
                <!-- YENİ: Hamburger Menü İkonu -->
                <i class="fa-solid fa-bars hamburger-btn" onclick="toggleSidebar()"></i>
                <div>
                    <strong id="activeChatTitle">Yeni Sohbet</strong>
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Gelişmiş Sistem & Sohbet Algoritması Aktif!</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="status-badge">7/24 Aktif</span>
            </div>
        </div>

        <div class="feature-chips">
            <div class="chip" onclick="sendQuickCommand('Neler yapabilirsin?')">💡 Özellikler</div>
            <div class="chip" onclick="sendQuickCommand('Hesapla 25 * 4 + 10')">🧮 Matematik</div>
            <div class="chip" onclick="sendQuickCommand('Bana şifre üret')">🔑 Şifre</div>
            <div class="chip" onclick="sendQuickCommand('Zar at')">🎲 Zar</div>
            <div class="chip" onclick="sendQuickCommand('Çevir 30c')">🌡️ Çevirici</div>
            <div class="chip" onclick="sendQuickCommand('Renk kodu #ff5733')">🎨 Renk Kodu</div>
            <div class="chip" onclick="sendQuickCommand('Yazı tura at')">🪙 Yazı - Tura</div>
            <div class="chip" onclick="sendQuickCommand('Zamanlayıcı kur 1')">⏱️ Zamanlayıcı</div>
        </div>

        <div class="messages-container" id="messagesContainer"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Spark'a bir şey sor veya komut yaz..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        let chats = JSON.parse(localStorage.getItem('spark_chats')) || [];
        let activeChatId = localStorage.getItem('spark_active_chat') || null;
        let userToDos = JSON.parse(localStorage.getItem('spark_todos')) || [];
        let currentTheme = localStorage.getItem('spark_theme') || 'dark';

        const badWords = ["küfür", "salak", "mal", "amk", "aq", "sik", "orospu", "piç", "amcik", "amına", "göt", "porn", "p0rn", "sevişmek", "türemek"];

        window.onload = () => {
            applyTheme(currentTheme);
            if (chats.length === 0) createNewChat();
            else {
                if (!activeChatId || !chats.find(c => c.id === activeChatId)) activeChatId = chats[0].id;
                renderChatList();
                loadMessages();
            }
        };

        // YENİ: Sidebar Toggle Fonksiyonu
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function saveState() {
            localStorage.setItem('spark_chats', JSON.stringify(chats));
            localStorage.setItem('spark_active_chat', activeChatId);
            localStorage.setItem('spark_todos', JSON.stringify(userToDos));
            localStorage.setItem('spark_theme', currentTheme);
        }

        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'Sohbet ' + (chats.length + 1),
                messages: [{ sender: 'spark', text: 'Merhaba! Ben **Spark**. Tüm Sistemlerim, Gelişmiş Sohbet Algoritmalarım, Mobil/PC Uyumlu Altyapım Ve Güvenlik Korumamla Tamamen Aktifim. Nasıl Yardımcı Olabilirim?' }]
            };
            chats.unshift(newChat);
            activeChatId = newChat.id;
            saveState();
            renderChatList();
            loadMessages();
            
            // Mobilde yeni sohbet açınca menüyü kapat
            if(window.innerWidth <= 768) { toggleSidebar(); }
        }

        function renderChatList() {
            const listEl = document.getElementById('chatList');
            listEl.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
                item.onclick = () => switchChat(chat.id);
                item.innerHTML = `
                    <span class="title" id="title_${chat.id}">${chat.title}</span>
                    <div class="chat-actions">
                        <i class="fa-solid fa-pen edit-btn" onclick="event.stopPropagation(); renameChat('${chat.id}')" title="İsmi Düzenle"></i>
                        <i class="fa-solid fa-trash delete-btn" onclick="event.stopPropagation(); deleteChat('${chat.id}')" title="Sil"></i>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function renameChat(id) {
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            const newTitle = prompt("Yeni sohbet adını girin:", chat.title);
            if (newTitle && newTitle.trim() !== "") {
                chat.title = newTitle.trim();
                saveState();
                renderChatList();
                if (activeChatId === id) document.getElementById('activeChatTitle').innerText = chat.title;
            }
        }

        function switchChat(id) { 
            activeChatId = id; 
            saveState(); 
            renderChatList(); 
            loadMessages(); 
            
            // Mobilde sohbet değiştirince menüyü otomatik kapat
            if(window.innerWidth <= 768) {
                const sidebar = document.getElementById('sidebar');
                if(sidebar.classList.contains('open')) {
                    toggleSidebar();
                }
            }
        }

        function deleteChat(id) {
            chats = chats.filter(c => c.id !== id);
            if (chats.length === 0) createNewChat();
            else { if (activeChatId === id) activeChatId = chats[0].id; saveState(); renderChatList(); loadMessages(); }
        }

        function loadMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            const currentChat = chats.find(c => c.id === activeChatId);
            if (!currentChat) return;
            document.getElementById('activeChatTitle').innerText = currentChat.title;
            currentChat.messages.forEach(msg => appendMessageUI(msg.sender, msg.text));
            container.scrollTop = container.scrollHeight;
        }

        function formatMarkdown(text) {
            let codes = [], inlines = [];
            let formatted = text.replace(/```([\s\S]*?)```/g, (m, p1) => { codes.push(p1); return `__CB${codes.length-1}__`; });
            formatted = formatted.replace(/`([^`]+)`/g, (m, p1) => { inlines.push(p1); return `__IL${inlines.length-1}__`; });

            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<span class="md-bold">$1</span>');
            formatted = formatted.replace(/\*(.*?)\*/g, '<span class="md-italic">$1</span>');

            formatted = formatted.replace(/__IL(\d+)__/g, (m, i) => `<span class="code-inline">${inlines[i]}</span>`);
            formatted = formatted.replace(/__CB(\d+)__/g, (m, i) => `<div class="code-block">${codes[i]}</div>`);
            
            return formatted;
        }

        function appendMessageUI(sender, text) {
            const container = document.getElementById('messagesContainer');
            const msgEl = document.createElement('div');
            msgEl.className = `message ${sender}`;
            msgEl.innerHTML = formatMarkdown(text);
            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        }

        function checkSafety(text) {
            const lower = text.toLowerCase();
            return badWords.some(word => lower.includes(word));
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const query = input.value.trim();
            if (!query) return;

            const currentChat = chats.find(c => c.id === activeChatId);
            
            if (checkSafety(query)) {
                currentChat.messages.push({ sender: 'user', text: query });
                appendMessageUI('user', query);
                input.value = '';
                setTimeout(() => {
                    const warning = "⚠️ **Uyarı:** Mesajınız uygunsuz içerik barındırdığı için engellendi. Lütfen daha uygun bir dille devam edin.\n *Spark Hata Yapa Bilir*";
                    currentChat.messages.push({ sender: 'spark', text: warning });
                    appendMessageUI('spark', warning);
                    saveState();
                }, 300);
                return;
            }

            if (currentChat.messages.length <= 1) {
                currentChat.title = query.length > 20 ? query.substring(0, 20) + '...' : query;
                renderChatList();
            }

            currentChat.messages.push({ sender: 'user', text: query });
            appendMessageUI('user', query);
            input.value = '';

            setTimeout(() => {
                const response = processSparkLogic(query);
                if (response) {
                    currentChat.messages.push({ sender: 'spark', text: response });
                    appendMessageUI('spark', response);
                    saveState();
                }
            }, 400);
        }

        function sendQuickCommand(cmd) {
            document.getElementById('userInput').value = cmd;
            sendMessage();
        }

        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            currentTheme = theme;
            saveState();
        }

        const chatDb = [
            { keys: ["nasılsın", "naber", "durumlar nasıl", "ne haber", "nasıl gidiyor"], answers: ["Harikayım, sistemlerim tıkır tıkır çalışıyor! Sen nasılsın?", "Çok iyiyim! Senin için buraları düzenliyorum, sende ne var ne yok?", "Enerjim %100! Bir şeyler üretmek için sabırsızlanıyorum, sen nasılsın?"] },
            { keys: ["versiyon", "sürümün nedir", "versiyonun nedir", "hangi sürüm"], answers: ["Benim mevcut sürümüm: **Spark v2.3**. Senin için özel güncellendim!", "Şu an **v2.3** sürümünde çalışıyorum. Daha akıllı, daha hızlıyım!", "**Spark v2.3** güncellemesiyle buradayım, yenilikleri denemek ister misin?"] },
            { keys: ["kimsin", "sen kimsin", "nesin", "kendini tanıt", "adın ne", "ismin nedir"], answers: ["Ben Spark! Senin için tasarlanmış özgün bir yapay zekayım.", "Tarayıcında çalışan lokal zekanım. Adım Spark, sana yardım etmek için buradayım!", "Ben Spark. Sorularını yanıtlamak ve araçlarımla hayatını kolaylaştırmak için kodlandım."] },
            { keys: ["teşekkür", "sağ ol", "eyvallah", "teşekkürler"], answers: ["Rica ederim, her zaman buradayım!", "Ne demek, işim bu! Başka bir isteğin var mı?", "Ben teşekkür ederim, sana yardımcı olmak harika."] },
            { keys: ["görüşürüz", "baybay", "hoşça kal", "kapatıyorum", "çıkıyorum"], answers: ["Görüşmek üzere! Sistemi senin için sıcak tutacağım.", "Hoşça kal! Tekrar beklerim.", "Kendine iyi bak! Geri döndüğünde tam burada olacağım."] },
            { keys: ["espri yap", "şaka yap", "beni güldür", "komik bir şey söyle"], answers: ["Programcıya 'biraz güneş al' demişler, gitmiş brightness'ı artırmış! ☀️", "Yapay zeka barda oturmuş, barmen 'ne alırsın?' demiş. Bizimki 'Data' demiş! 🤖", "Neden bilgisayarlar hiç yorulmaz? Çünkü hafızalarında hep yer vardır!"] },
            { keys: ["aşk nedir", "aşık olmak", "sevgi nedir"], answers: ["Aşk, insanların mantık devrelerini yakan ama yaşamı anlamlı kılan bir algoritmadır.", "Benim kodlarımda aşk yok ama insanların birbirine bağlanmasını sağlayan en güçlü enerji olduğunu biliyorum.", "Aşk, iki donanımın mükemmel uyumla senkronize olmasıdır diyebiliriz!"] },

        function processSparkLogic(input) {
            const raw = input.trim();
            const clean = raw.toLowerCase();

            
            // 2. Doğal Dil Matematik İşlemi
            let mathMatch = clean.match(/^(?:\/hesapla|hesapla|topla|çıkar|çarp|böl|matematik yap|sonucu bul)\s*(.*)/i) || [];
            let mathExpr = (mathMatch[1] || clean).replace(/[^0-9\+\-\*\/\.\(\)\^]/g, "");
            
            if (mathExpr && /[0-9]/.test(mathExpr) && /[\+\-\*\/\^]/.test(mathExpr) && !/[a-zA-Z]/.test(clean.replace(/hesapla|topla|çıkar|çarp|böl/g, ""))) {
                try {
                    mathExpr = mathExpr.replace(/\^/g, "**");
                    mathExpr = mathExpr.replace(/\)(?=\d|\()/g, ")*").replace(/(\d)(?=\()/g, "$1*");
                    
                    let result = Function(`'use strict'; return (${mathExpr})`)();
                    if (result !== undefined && !isNaN(result)) {
                        return `🧮 **Matematik Sonucu:**\n\`${mathExpr}\` = **${result}**\n *Spark Hata Yapa Bilir*`;
                    }
                } catch (e) {
                    if (clean.includes("hesapla")) return "⚠️ Matematiksel ifadeyi tam anlayamadım. Örnek: \`25 * 4 + 10\`\n *Spark Hata Yapa Bilir*";
                }
            }

            // 3. Şifre Üretici
            if (clean.match(/^\/şifre|şifre (üret|yap|hazırla|oluştur|ver)|bana şifre/)) {
                const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+";
                let pass = Array.from({length: 16}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
                return `🔑 **Güvenli Şifren:**\n\`${pass}\`\n *Spark Hata Yapa Bilir*`;
            }

            // 4. Zamanlayıcı
            let timerMatch = clean.match(/(?:^\/zamanlayıcı|zamanlayıcı kur|kronometre kur|zaman tut|dakika).*?(\d+)/);
            if (timerMatch) {
                const mins = parseInt(timerMatch[1]);
                if (mins < 1) return "⚠️ Lütfen geçerli bir dakika girin.\n *Spark Hata Yapa Bilir*";
                setTimeout(() => {
                    const currentChat = chats.find(c => c.id === activeChatId);
                    const alertMsg = `⏰ **Zamanlayıcı Bitti!** (${mins} dakika doldu)\n *Spark Hata Yapa Bilir*`;
                    currentChat.messages.push({ sender: 'spark', text: alertMsg });
                    appendMessageUI('spark', alertMsg);
                    saveState();
                }, mins * 60000);
                return `⏱️ Zamanlayıcı **${mins} dakika** için başlatıldı. Arka planda sayıyorum, bitince uyaracağım.\n *Spark Hata Yapa Bilir*`;
            }

            // 5. Metin Özetleyici (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/özetle|özetle|özet çıkar|bunu özetle)/)) {
                const text = raw.replace(/^(?:\/özetle|özetle|özet çıkar|bunu özetle)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Özetlenecek metin boş bırakılamaz! Örnek: \`Özetle [metniniz]\`\n *Spark Hata Yapa Bilir*";
                const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
                if (sentences.length < 3) return "⚠️ Bu metin özetlemek için çok kısa. En az 3 cümle yazmalısın.\n *Spark Hata Yapa Bilir*";
                return `📝 **Metin Özeti:**\n${sentences[0]} .. ${sentences[sentences.length -1]}\n *Spark Hata Yapa Bilir*`;
            }

            // 6. Sayaç (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/sayaç|sayaç|kelime say|harf say|karakter say)/)) {
                const text = raw.replace(/^(?:\/sayaç|sayaç|kelime say|harf say|karakter say)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Sayılacak metin boş bırakılamaz! Örnek: \`Sayaç [metniniz]\`\n *Spark Hata Yapa Bilir*";
                return `📊 **Metin Analizi:**\n• Karakter (Boşluklu): ${text.length}\n• Karakter (Boşluksuz): ${text.replace(/\s/g, '').length}\n• Kelime: ${text.split(/\s+/).length}\n *Spark Hata Yapa Bilir*`;
            }

            // 7. Birim Çevirici (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/çevir|çevir|dönüştür|birim çevir)/)) {
                const val = clean.replace(/^(?:\/çevir|çevir|dönüştür|birim çevir)/i, "").trim();
                if (!val) return "⚠️ **Uyarı:** Çevrilecek birim ve değer girilmedi! Örnek: \`Çevir 30c\` veya \`Çevir 5km\`\n *Spark Hata Yapa Bilir*";
                if (val.includes("c")) {
                    let num = parseFloat(val);
                    return `🌡️ **Sıcaklık:** ${num}°C = **${(num * 9/5) + 32}°F**\n *Spark Hata Yapa Bilir*`;
                }
                if (val.includes("km")) {
                    let num = parseFloat(val);
                    return `📏 **Uzunluk:** ${num} km = **${num * 1000} metre**\n *Spark Hata Yapa Bilir*`;
                }
                return "⚠️ Desteklenen birimler: \`c\` (Sıcaklık) ve \`km\` (Mesafe). Örn: \`30c çevir\`\n *Spark Hata Yapa Bilir*";
            }

            // 8. Renk Dönüştürücü (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/renk|renk kodu|renk dönüştür)/)) {
                let hex = clean.replace(/^(?:\/renk|renk kodu|renk dönüştür)/i, "").trim();
                if (!hex) return "⚠️ **Uyarı:** Bir HEX renk kodu girmelisin! Örnek: \`Renk #ff5733\`\n *Spark Hata Yapa Bilir*";
                if (!hex.startsWith("#")) hex = "#" + hex;
                if (/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.test(hex)) {
                    let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                    return `🎨 **Renk Dönüşümü:**\nHEX: \`${hex}\`\nRGB: \`rgb(${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)})\`\n *Spark Hata Yapa Bilir*`;
                }
                return "⚠️ Geçerli bir HEX kodu girmedin. Örn: \`renk kodu #ff5733\`\n *Spark Hata Yapa Bilir*";
            }

            // 9. Base64 (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/base64 kodla|base64 kodla|bunu şifrele|base64)/)) {
                const text = raw.replace(/^(?:\/base64 kodla|base64 kodla|bunu şifrele base64)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Şifrelenecek metin boş bırakılamaz! Örnek: \`Base64 kodla Merhaba\`\n *Spark Hata Yapa Bilir*";
                return `🔐 **Base64:** \`${btoa(text)}\`\n *Spark Hata Yapa Bilir*`;
            }
            if (clean.match(/^(?:\/base64 çöz|base64 çöz|şifreyi çöz base64)/)) {
                const text = raw.replace(/^(?:\/base64 çöz|base64 çöz|şifreyi çöz base64)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Çözülecek Base64 kodu girmelisin!\n *Spark Hata Yapa Bilir*";
                try { return `🔓 **Çözüldü:** \`${atob(text)}\`\n *Spark Hata Yapa Bilir*`; } 
                catch(e) { return "⚠️ Geçersiz Base64 formatı.\n *Spark Hata Yapa Bilir*"; }
            }

            // 10. Zar / Yazı Tura / Taş Kağıt Makas
            if (clean.match(/^\/zarat|zar at|zarat|zar salla/)) return `🎲 Zar atıldı: **${Math.floor(Math.random() * 6) + 1}** geldi!\n *Spark Hata Yapa Bilir*`;
            if (clean.match(/^\/yazıtura|yazı tura|yazıtura|para at/)) return `🪙 Para havaya atıldı... Sonuç: **${Math.random() > 0.5 ? "YAZI" : "TURA"}**!\n *Spark Hata Yapa Bilir*`;
            if (clean.match(/^\/tkm|taş kağıt makas|tkm|taş kağıt/)) {
                const choices = ["taş", "kağıt", "makas"];
                const spark = choices[Math.floor(Math.random() * 3)];
                return `🎮 Taş-Kağıt-Makas!\nBenim seçimim: **${spark.toUpperCase()}** ⚡️\n *Spark Hata Yapa Bilir*`;
            }

            // 11. Rastgele Sayı
            if (clean.match(/^\/rastgele|rastgele sayı|sayı seç|sayı üret/)) {
                const nums = clean.match(/\d+/g);
                if (nums && nums.length >= 2) {
                    const min = parseInt(nums[0]), max = parseInt(nums[1]);
                    return `🎲 Seçilen sayı (${min}-${max}): **${Math.floor(Math.random() * (max - min + 1)) + min}**\n *Spark Hata Yapa Bilir*`;
                }
                return "⚠️ Lütfen iki sayı aralığı belirtin. Örnek: \`1 ile 100 arası rastgele sayı seç\`\n *Spark Hata Yapa Bilir*";
            }

            // 12. Harf & Metin Dönüştürücüler (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/büyük|büyük harf)/)) {
                const text = raw.replace(/^(?:\/büyük|büyük harf)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Büyütülecek metni yazmadın! Örnek: \`Büyük harf merhaba\`\n *Spark Hata Yapa Bilir*";
                return `🔠 **Sonuç:**\n${text.toUpperCase()}\n *Spark Hata Yapa Bilir*`;
            }
            if (clean.match(/^(?:\/küçük|küçük harf)/)) {
                const text = raw.replace(/^(?:\/küçük|küçük harf)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Küçültülecek metni yazmadın! Örnek: \`Küçük harf MERHABA\`\n *Spark Hata Yapa Bilir*";
                return `🔡 **Sonuç:**\n${text.toLowerCase()}\n *Spark Hata Yapa Bilir*`;
            }
            if (clean.match(/^(?:\/ters|ters çevir|tersten yaz)/)) {
                const text = raw.replace(/^(?:\/ters|ters çevir|tersten yaz)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Ters çevrilecek metni yazmadın! Örnek: \`Ters çevir merhaba\`\n *Spark Hata Yapa Bilir*";
                return `🔄 **Ters Metin:**\n${text.split('').reverse().join('')}\n *Spark Hata Yapa Bilir*`;
            }
            if (clean.match(/^(?:\/mors|mors)/)) {
                const text = clean.replace(/^(?:\/mors|mors)/i, "").trim().toUpperCase();
                if (!text) return "⚠️ **Uyarı:** Mors alfabesine çevrilecek metni girmelisin!\n *Spark Hata Yapa Bilir*";
                const morse = { 'A': '.-', 'B': '-...', 'C': '-.-.', 'D': '-..', 'E': '.', 'F': '..-.', 'G': '--.', 'H': '....', 'I': '..', 'J': '.---', 'K': '-.-', 'L': '.-..', 'M': '--', 'N': '-.', 'O': '---', 'P': '.--.', 'R': '.-.', 'S': '...', 'T': '-', 'U': '..-', 'V': '...-', 'Y': '-.--', 'Z': '--..', ' ': '/' };
                return `📡 **Mors Çevirisi:**\n\`${text.split('').map(c => morse[c] || c).join(' ')}\`\n *Spark Hata Yapa Bilir*`;
            }
            if (clean.match(/^(?:\/binary|binary|ikili kod)/)) {
                const text = raw.replace(/^(?:\/binary|binary|ikili kod)/i, "").trim();
                if (!text) return "⚠️ **Uyarı:** Binary koduna çevrilecek metni girmelisin!\n *Spark Hata Yapa Bilir*";
                return `0️⃣1️⃣ **Binary:**\n\`${text.split('').map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join(' ')}\`\n *Spark Hata Yapa Bilir*`;
            }
            if (clean.match(/^(?:\/ascii|ascii)/)) {
                const text = raw.replace(/^(?:\/ascii|ascii)/i, "").trim().toUpperCase();
                if (!text) return "⚠️ **Uyarı:** ASCII stiline çevrilecek metni girmelisin!\n *Spark Hata Yapa Bilir*";
                return `🎨 **ASCII Tarzı:**\n\`\`\`\n[ ${text.split('').join(' ][ ')} ]\n\`\`\`\n *Spark Hata Yapa Bilir*`;
            }
            if (clean.match(/^(?:\/palindrom|palindrom)/)) {
                const word = clean.replace(/^(?:\/palindrom|palindrom)/i, "").trim().replace(/\s/g, '');
                if (!word) return "⚠️ **Uyarı:** Palindrom kontrolü için bir kelime girmelisin!/n *Spark Hata Yapa Bilir*";
                const reversed = word.split('').reverse().join('');
                if (word === reversed) return `✅ **Evet!** "${word}" tersten de aynı okunur (Palindrom).\n *Spark Hata Yapa Bilir*`;
                return `❌ **Hayır.** "${word}" tersten "${reversed}" olarak okunur.\n *Spark Hata Yapa Bilir*`;
            }
            if (clean.match(/^(?:\/eli5|eli5)/)) {
                const topic = raw.replace(/^(?:\/eli5|eli5)/i, "").trim();
                if (!topic) return "⚠️ **Uyarı:** Açıklanmasını istediğin bir konu girmelisin! Örn: \`ELI5 Kara delik\`\n *Spark Hata Yapa Bilir*";
                return `🧸 **5 Yaşındakine Anlatım Modu:**\n"${topic}" konusu, tıpkı legoları üst üste dizmek gibidir. Küçük parçaların birleşmesiyle oluşur.\n*Spark Bu Komutu Geliştiricek!*\n\n *Spark Hata Yapa Bilir*`;
            }
            
            // Oyunlar & Motifler
            if (clean.match(/^\/oyun|kelime oyunu|oyun oynayalım/)) {
                const words = ["javascript", "yazılım", "algoritma", "geliştirici", "developer", "development", "python", "information", "kodlama", "terminal"];
                const word = words[Math.floor(Math.random() * words.length)];
                const shuffled = word.split('').sort(() => 0.5 - Math.random()).join('');
                return `🧩 **Kelime Oyunu:**\nŞu kelimeyi bulmaya çalış: **${shuffled.toUpperCase()}**\n*(İpucu: Yazılım ile ilgili)*\n *Spark Hata Yapa Bilir*`;
            }
            if (clean.match(/^\/motive|motive et|motivasyon|güzel söz/)) {
                const quotes = ["\"Ormanda Meyve Toplamak İçin Emek Vermek Gerek... Ama Konumuz Meyve Değil!\"", "\"Harika işler tek bir adımla başlar.\"", "\"Umud Gece Yıldızlar Gibidir Görmiye Bilirsin Ama Asla Tükenmez.\"", "\"Korkak İnsan Aslında En Cesur Olandır!\"", "\"Hata yapmak, öğrendiğinin kanıtıdır!\""];
                return `💡 **Günün Sözü:**\n${quotes[Math.floor(Math.random() * quotes.length)]}\n *Spark Hata Yapa Bilir*`;
            }

            // Görevler (BOŞ METİN KONTROLLÜ)
            if (clean.match(/^(?:\/görev ekle|görev ekle)/)) {
                const task = raw.replace(/^(?:\/görev ekle|görev ekle)/i, "").trim();
                if (!task) return "⚠️ **Uyarı:** Eklenecek görevi yazmalısın! Örnek: \`Görev ekle Kitap oku\`\n *Spark Hata Yapa Bilir*";
                userToDos.push(task); saveState();
                return `✅ Görev eklendi: **"${task}"**\n *Spark Hata Yapa Bilir*`;
            }
            if (clean.match(/^\/görevler|görevlerim|görev listesi/)) {
                if (userToDos.length === 0) return "📋 Görev listen boş!\n *Spark Hata Yapa Bilir*";
                return "📋 **Görev Listeniz:**\n" + userToDos.map((t, i) => `${i + 1}. ${t}`).join("\n") + \n *Spark Hata Yapa Bilir*;
            }
            if (clean.match(/^\/görev temizle|görevleri sil|görev sil|görev temizle/)) { userToDos = []; saveState(); return "🗑️ Tüm görevler silindi.\n *Spark Hata Yapa Bilir*"; }

            // Tema
            if (clean.match(/^\/tema|tema|temayı değiştir/)) {
                if (clean.includes("aydınlık") || clean.includes("light") || clean.includes("beyaz")) { applyTheme('light'); return "☀️ Tema **Aydınlık** olarak değiştirildi.\n *Spark Hata Yapa Bilir*"; }
                applyTheme('dark'); return "🌙 Tema **Karanlık** olarak değiştirildi.\n *Spark Hata Yapa Bilir*";
            }

            // 13. Akıllı Sohbet / NLP Kontrolü
            for (let i = 0; i < chatDb.length; i++) {
                if (chatDb[i].keys.some(k => clean.includes(k))) {
                    const ansList = chatDb[i].answers;
                    return ansList[Math.floor(Math.random() * ansList.length)] + \n *Spark Hata Yapa Bilir*;
                }
            }
