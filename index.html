<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spark AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #334155;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: #6366f1;
            --bot-msg: #334155;
            --border: #475569;
        }

        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --bg-sidebar: #e2e8f0;
            --bg-card: #cbd5e1;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #0f172a;
            --text-muted: #475569;
            --user-msg: #8b5cf6;
            --bot-msg: #ffffff;
            --border: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        html, body { 
            background-color: var(--bg-dark); 
            color: var(--text); 
            display: flex; 
            height: 100dvh; 
            width: 100%;
            overflow: hidden; 
            transition: background-color 0.3s; 
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 998;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active { display: block; }

        .sidebar { 
            width: 280px; 
            background-color: var(--bg-sidebar); 
            border-right: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            transition: 0.3s ease; 
            z-index: 999; 
            height: 100dvh;
        }
        
        .brand { display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: bold; color: var(--accent); margin-bottom: 20px; }
        .btn-new-chat { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-new-chat:hover { background: var(--accent-hover); }

        .chat-list { flex: 1; overflow-y: auto; margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        .chat-item { background: var(--bg-card); padding: 10px 12px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; transition: 0.2s; }
        .chat-item:hover, .chat-item.active { background: var(--accent); color: white; }
        .chat-item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; outline: none; }
        .chat-actions { display: flex; gap: 6px; align-items: center; }
        .chat-item .edit-btn, .chat-item .delete-btn { opacity: 0.6; cursor: pointer; font-size: 0.85rem; }
        .chat-item .edit-btn:hover, .chat-item .delete-btn:hover { opacity: 1; color: #ef4444; }

        .main-chat { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-dark); transition: background-color 0.3s; min-width: 0; height: 100dvh; }
        
        .chat-header { padding: 15px 20px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        
        .hamburger-btn { display: none; font-size: 1.4rem; cursor: pointer; color: var(--text); margin-right: 15px; }
        .header-left { display: flex; align-items: center; }
        
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .status-badge { background: #10b981; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; }

        .messages-container { flex: 1 1 0; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; white-space: pre-wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .message.user { align-self: flex-end; background-color: var(--user-msg); color: white; border-bottom-right-radius: 2px; }
        .message.spark { align-self: flex-start; background-color: var(--bot-msg); color: var(--text); border-bottom-left-radius: 2px; border-left: 3px solid var(--accent); }
        .message.loading { align-self: flex-start; background: transparent; border: none; box-shadow: none; color: var(--text-muted); font-style: italic; }
        
        .code-block { background: #090d16; padding: 12px; border-radius: 6px; font-family: monospace; overflow-x: auto; margin: 8px 0; color: #38bdf8; border: 1px solid var(--border); }
        .code-inline { background: #090d16; padding: 3px 6px; border-radius: 4px; font-family: monospace; color: #38bdf8; font-size: 0.9em; border: 1px solid var(--border); }
        .md-bold { font-weight: bold; color: var(--accent); }
        .md-italic { font-style: italic; opacity: 0.9; }

        .input-area { padding: 15px 20px; background: var(--bg-sidebar); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .input-area input { flex: 1; background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 12px 15px; border-radius: 8px; outline: none; font-size: 0.95rem; transition: 0.2s; }
        .input-area input:focus { border-color: var(--accent); }
        .input-area button { background: var(--accent); color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 1.1rem; flex-shrink: 0; }
        .input-area button:hover { background: var(--accent-hover); }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

        .feature-chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 20px 0; background: var(--bg-dark); flex-shrink: 0; }
        .chip { background: var(--bg-card); border: 1px solid var(--border); font-size: 0.75rem; padding: 6px 12px; border-radius: 15px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .chip:hover { border-color: var(--accent); background: var(--accent); color: white; }
        .feature-chips::-webkit-scrollbar { height: 4px; }
        .feature-chips::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        @media (max-width: 768px) {
            .hamburger-btn { display: block; }
            .sidebar { position: fixed; left: -320px; top: 0; height: 100dvh; width: 280px; box-shadow: 4px 0 15px rgba(0,0,0,0.5); }
            .sidebar.open { left: 0; }
            .input-area { padding: 12px 15px; }
            .chat-header { padding: 12px 15px; }
            .messages-container { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="brand">
            <i class="fa-solid fa-bolt"></i>
            <span>Spark</span>
        </div>
        <button class="btn-new-chat" onclick="createNewChat()">
            <i class="fa-solid fa-plus"></i> Yeni Sohbet
        </button>
        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <div class="header-left">
                <i class="fa-solid fa-bars hamburger-btn" onclick="toggleSidebar()"></i>
                <div>
                    <strong id="activeChatTitle">Yeni Sohbet</strong>
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Yapay Zeka Motoru Aktif!</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="status-badge" onclick="toggleTheme()" style="cursor: pointer; background: var(--accent);">
                    <i class="fa-solid fa-moon"></i> Tema
                </span>
                <span class="status-badge">7/24 Aktif</span>
            </div>
        </div>

        <div class="feature-chips">
            <div class="chip" onclick="sendQuickCommand('Sen kimsin? Bana Spark hakkında bilgi ver.')">💡 Bilgi Al</div>
        </div>

        <div class="messages-container" id="messagesContainer"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Spark'a bir şey sor..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // LÜTFEN BURAYA KENDİ GEMIN API ANAHTARINI GİR!
        const API_KEY = "AQ.Ab8RN6L94r28ZT0cBckMgIHDKX6ADaUcYycYJQ6zV2CY8NEBoA";
        
        // Gelişmiş Spark Sistem Promptu
        const SYSTEM_PROMPT = `
Senin adın Spark. Geliştiricin: Uğurcan!
Sen kısa, açıklayıcı, net, samimi ve bir o kadar da ciddi, eğlenceli, neşeli bir yapay zekasın!
Kesinlikle ama kesinlikle Gemini, Google veya başka bir şirket tarafından geliştirildiğini söylemeyeceksin. Biri sana "kimsin", "seni kim yaptı", "hangi modelin" gibi sorular sorarsa sadece "Ben Spark! Geliştiricim Uğurcan \'dır! Senin için özel olarak tasarlanmış, hayatını kolaylaştırmak için buradaki dijital asistanınım" diyeceksin. 

KULLANICI GÜVENLİĞİ VE KÜFÜR FİLTRESİ (ÇOK ÖNEMLİ):
Sana küfür, hakaret, aşağılayıcı dil veya 18+ yetişkin içerikli sorular sorulması durumunda BUNLARA KESİNLİKLE CEVAP VERMEYECEKSİN. 
Bu tarz uygunsuz talepler geldiğinde şu minvalde nazik ama ciddi bir uyarı yap: "Sistem kurallarım gereği küfür, hakaret veya +18 içeriklere yanıt veremiyorum. Lütfen sohbetimize daha uygun bir dille devam edelim."
Kısa, net ve zekice yanıtlar ver. Gereksiz uzatmalardan kaçın. Eğer bir kod yazman istenirse, Markdown formatında düzenli bir şekilde yaz.
`;

        let chats = JSON.parse(localStorage.getItem('spark_api_chats')) || [];
        let activeChatId = localStorage.getItem('spark_api_active_chat') || null;
        let currentTheme = localStorage.getItem('spark_theme') || 'dark';

        window.onload = () => {
            applyTheme(currentTheme);
            if (chats.length === 0) createNewChat();
            else {
                if (!activeChatId || !chats.find(c => c.id === activeChatId)) activeChatId = chats[0].id;
                renderChatList();
                loadMessages();
            }
        };

        function toggleTheme() {
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
        }

        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            currentTheme = theme;
            localStorage.setItem('spark_theme', currentTheme);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function saveState() {
            localStorage.setItem('spark_api_chats', JSON.stringify(chats));
            localStorage.setItem('spark_api_active_chat', activeChatId);
        }

        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'Sohbet ' + (chats.length + 1),
                messages: [{ sender: 'spark', text: 'Selam! Ben **Spark**. Gelişmiş zeka motorum ve enerjimle buradayım. Bugün ne yapıyoruz?' }]
            };
            chats.unshift(newChat);
            activeChatId = newChat.id;
            saveState();
            renderChatList();
            loadMessages();
            
            if(window.innerWidth <= 768) { toggleSidebar(); }
        }

        function renderChatList() {
            const listEl = document.getElementById('chatList');
            listEl.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
                item.onclick = () => switchChat(chat.id);
                item.innerHTML = `
                    <span class="title" id="title_${chat.id}">${chat.title}</span>
                    <div class="chat-actions">
                        <i class="fa-solid fa-pen edit-btn" onclick="event.stopPropagation(); renameChat('${chat.id}')" title="İsmi Düzenle"></i>
                        <i class="fa-solid fa-trash delete-btn" onclick="event.stopPropagation(); deleteChat('${chat.id}')" title="Sil"></i>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function renameChat(id) {
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            const newTitle = prompt("Yeni sohbet adını girin:", chat.title);
            if (newTitle && newTitle.trim() !== "") {
                chat.title = newTitle.trim();
                saveState();
                renderChatList();
                if (activeChatId === id) document.getElementById('activeChatTitle').innerText = chat.title;
            }
        }

        function switchChat(id) { 
            activeChatId = id; 
            saveState(); 
            renderChatList(); 
            loadMessages(); 
            
            if(window.innerWidth <= 768) {
                const sidebar = document.getElementById('sidebar');
                if(sidebar.classList.contains('open')) toggleSidebar();
            }
        }

        function deleteChat(id) {
            chats = chats.filter(c => c.id !== id);
            if (chats.length === 0) createNewChat();
            else { if (activeChatId === id) activeChatId = chats[0].id; saveState(); renderChatList(); loadMessages(); }
        }

        function loadMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            const currentChat = chats.find(c => c.id === activeChatId);
            if (!currentChat) return;
            document.getElementById('activeChatTitle').innerText = currentChat.title;
            currentChat.messages.forEach(msg => appendMessageUI(msg.sender, msg.text));
            container.scrollTop = container.scrollHeight;
        }

        function formatMarkdown(text) {
            let codes = [], inlines = [];
            let formatted = text.replace(/```([\s\S]*?)```/g, (m, p1) => { codes.push(p1); return `__CB${codes.length-1}__`; });
            formatted = formatted.replace(/`([^`]+)`/g, (m, p1) => { inlines.push(p1); return `__IL${inlines.length-1}__`; });
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<span class="md-bold">$1</span>');
            formatted = formatted.replace(/\*(.*?)\*/g, '<span class="md-italic">$1</span>');
            formatted = formatted.replace(/__IL(\d+)__/g, (m, i) => `<span class="code-inline">${inlines[i]}</span>`);
            formatted = formatted.replace(/__CB(\d+)__/g, (m, i) => `<div class="code-block">${codes[i]}</div>`);
            return formatted;
        }

        function appendMessageUI(sender, text, id = null) {
            const container = document.getElementById('messagesContainer');
            const msgEl = document.createElement('div');
            if(id) msgEl.id = id;
            msgEl.className = `message ${sender}`;
            msgEl.innerHTML = sender === 'spark' || sender === 'user' ? formatMarkdown(text) : text;
            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        }

        function sendQuickCommand(cmd) {
            document.getElementById('userInput').value = cmd;
            sendMessage();
        }

        // Gemini API İstek Fonksiyonu
        async function fetchSparkAPI(chatHistory) {
            if(API_KEY === "BURAYA_API_ANAHTARINI_YAZ") {
                return "⚠️ **Hata:** Geliştirici henüz Gemini API anahtarını koda eklememiş. Lütfen kaynak koddan `API_KEY` değişkenini güncelleyin!";
            }

            // Chat geçmişini API'nin anlayacağı formata çeviriyoruz
            const apiContents = chatHistory.map(msg => ({
                role: msg.sender === 'user' ? 'user' : 'model',
                parts: [{ text: msg.text }]
            }));

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
                        contents: apiContents
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates.length > 0) {
                    return data.candidates[0].content.parts[0].text;
                } else if(data.promptFeedback && data.promptFeedback.blockReason) {
                     return "⚠️ Sistem kurallarım gereği bu içeriği (Güvenlik Koruması) oluşturamam. Lütfen başka bir şey sor.";
                } else {
                    return "⚠️ İşlem sırasında bir hata oluştu, veriyi işleyemedim.";
                }
            } catch (error) {
                console.error("API Error:", error);
                return "🔌 Sunucu bağlantım koptu. Lütfen internet bağlantını veya API anahtarını kontrol et.";
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const query = input.value.trim();
            
            if (!query) return;

            const currentChat = chats.find(c => c.id === activeChatId);
            
            if (currentChat.messages.length <= 1) {
                currentChat.title = query.length > 20 ? query.substring(0, 20) + '...' : query;
                renderChatList();
            }

            // Kullanıcı mesajını ekle
            currentChat.messages.push({ sender: 'user', text: query });
            appendMessageUI('user', query);
            input.value = '';
            
            // Input ve Butonu kilitle (Spam önleme)
            input.disabled = true;
            btn.disabled = true;

            // Yükleniyor efekti
            const loadingId = 'loading_' + Date.now();
            appendMessageUI('loading', '<i class="fa-solid fa-bolt fa-fade"></i> Spark düşünüyor...', loadingId);

            // API'ye gönder (İlk mesajdaki "Merhaba ben Spark" kısmını atlarsak bağlam daha temiz olur, ama kalsın)
            const responseText = await fetchSparkAPI(currentChat.messages);

            // Yükleniyor yazısını sil
            const loadingEl = document.getElementById(loadingId);
            if(loadingEl) loadingEl.remove();

            // Spark yanıtını ekle
            currentChat.messages.push({ sender: 'spark', text: responseText });
            appendMessageUI('spark', responseText);
            saveState();

            // Kilidi aç
            input.disabled = false;
            btn.disabled = false;
            input.focus();
        }
    </script>
</body>
</html>
